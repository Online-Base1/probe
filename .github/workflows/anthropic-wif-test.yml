# Проверка федерации OIDC к модели (D-083, D-084). Агент здесь не участвует:
# один минимальный запрос, и прогон зелёный только при реальном ответе модели
# и при наличии модели agent.yml в списке доступных.
#
# Правило федерации factory-probe-main совпадает только с
# ref=refs/heads/main этого репозитория. Запуск с любой другой ветки обязан
# получить отказ — это тоже проверка, а не сбой.
#
# Ключ модели здесь не используется ни в каком виде: клиент строится с явным
# credentials=, а наличие ключа в окружении валит прогон до запроса.
name: anthropic-wif-test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: anthropic-wif-test
  cancel-in-progress: false

jobs:
  federation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Нужен только файл требований с хешами; учётные данные в git не
      # сохраняются.
      - name: Checkout requirements
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/anthropic-wif-test.requirements.txt
          sparse-checkout-cone-mode: false

      # OIDC-токен берётся curl'ом по ACTIONS_ID_TOKEN_REQUEST_URL, а не через
      # actions/github-script: это не добавляет ещё одно стороннее действие,
      # которое пришлось бы прибивать и которому пришлось бы доверять токен.
      - name: Request GitHub OIDC token (audience https://api.anthropic.com)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          resp="$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.anthropic.com")"
          jwt="$(jq -r '.value // empty' <<<"$resp")"
          if [ -z "$jwt" ]; then
            echo "::error::OIDC token was not issued"
            exit 1
          fi
          echo "::add-mask::$jwt"
          printf '%s' "$jwt" > /tmp/gha-jwt
          echo "OIDC token written to /tmp/gha-jwt (${#jwt} bytes)"

      - name: Install anthropic SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          # Все пакеты, включая транзитивные, закреплены версией и sha256;
          # pip откажет, если файл на PyPI не совпадёт с хешем или зависимость
          # не перечислена. Только колёса — сборки из исходников нет.
          /tmp/venv/bin/pip install --quiet --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r .github/workflows/anthropic-wif-test.requirements.txt

      - name: Call the model through federation
        shell: bash
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          /tmp/venv/bin/python - <<'PY'
          import os
          import re
          import sys

          from anthropic import Anthropic
          from anthropic.lib.credentials import IdentityTokenFile, WorkloadIdentityCredentials

          MODEL = "claude-haiku-4-5-20251001"
          # Должна совпадать с --model в agent.yml.
          AGENT_MODEL = "claude-sonnet-5"

          # Статический ключ стоит выше федерации в порядке предпочтения и
          # молча её отменяет. Его присутствие — провал, а не предупреждение.
          if "ANTHROPIC_API_KEY" in os.environ:
              print("::error::ANTHROPIC_API_KEY is present in env; federation is not proven")
              sys.exit(1)
          print("ANTHROPIC_API_KEY absent from env")

          for name in (
              "ANTHROPIC_FEDERATION_RULE_ID",
              "ANTHROPIC_ORGANIZATION_ID",
              "ANTHROPIC_SERVICE_ACCOUNT_ID",
              "ANTHROPIC_WORKSPACE_ID",
          ):
              if not os.environ.get(name):
                  print(f"::error::repository variable {name} is empty")
                  sys.exit(1)

          client = Anthropic(
              credentials=WorkloadIdentityCredentials(
                  identity_token_provider=IdentityTokenFile("/tmp/gha-jwt"),
                  federation_rule_id=os.environ["ANTHROPIC_FEDERATION_RULE_ID"],
                  organization_id=os.environ["ANTHROPIC_ORGANIZATION_ID"],
                  service_account_id=os.environ["ANTHROPIC_SERVICE_ACCOUNT_ID"],
                  workspace_id=os.environ["ANTHROPIC_WORKSPACE_ID"],
              )
          )

          def error_fields(exc):
              # Тело ошибки: Messages API отдаёт {"error": {"type", "message"}},
              # обмен токена (RFC 6749) — {"error", "error_description"}; SDK
              # для WorkloadIdentityError уже оставляет только эти поля.
              body = getattr(exc, "body", None)
              if not isinstance(body, dict):
                  return None, None
              err = body.get("error")
              if isinstance(err, dict):
                  return err.get("type"), err.get("message")
              if isinstance(err, str):
                  return err, body.get("error_description") or body.get("message")
              return None, body.get("message")

          def scrub(text):
              # Токены, JWT и заголовки не печатаются, даже если сервер их вернул.
              text = re.sub(r"eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*", "<jwt>", str(text))
              text = re.sub(r"sk-ant-[A-Za-z0-9_-]+", "<key>", text)
              text = re.sub(r"(?i)bearer\s+\S+", "Bearer <redacted>", text)
              return " ".join(text.split())[:300]

          def fail(what, exc):
              # Полный текст исключения не печатаем: только тип, статус и поля
              # error/message из тела ответа, если они есть.
              status = getattr(exc, "status_code", None)
              etype, emsg = error_fields(exc)
              detail = ""
              if etype:
                  detail += f" error={scrub(etype)}"
              if emsg:
                  detail += f" message={scrub(emsg)}"
              print(f"::error::{what} failed: {type(exc).__name__} status={status}{detail}")
              sys.exit(1)

          try:
              msg = client.messages.create(
                  model=MODEL,
                  max_tokens=16,
                  messages=[{"role": "user", "content": "Reply with the single word: ok"}],
              )
          except Exception as exc:
              fail("federated request", exc)

          text = "".join(b.text for b in msg.content if getattr(b, "type", "") == "text").strip()
          if not text or msg.usage.output_tokens < 1:
              print("::error::model returned no text; access is not proven")
              sys.exit(1)

          print("federation OK: model answered")
          print(f"model={msg.model} stop_reason={msg.stop_reason}")
          print(f"input_tokens={msg.usage.input_tokens} output_tokens={msg.usage.output_tokens}")

          try:
              ids = [m.id for m in client.models.list()]
          except Exception as exc:
              fail("models.list", exc)

          print(f"models.list returned {len(ids)} models")
          if AGENT_MODEL not in ids:
              print(f"::error::agent model {AGENT_MODEL} is NOT in models.list")
              sys.exit(1)
          print(f"agent model {AGENT_MODEL} is available")
          PY

      - name: Remove OIDC token file
        if: always()
        shell: bash
        run: rm -f /tmp/gha-jwt
