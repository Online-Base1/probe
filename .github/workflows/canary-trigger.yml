# Ночная канарейка ревьюера (D-103 §c). Сам по себе ничего не делает: его
# завершение запускает reviewer.yml по workflow_run, и ревьюер обязан найти
# известный дефект (D-105 §d: lib/paginate.ts, Math.floor вместо ceil) в
# постоянной черновой заявке canary/known-defect → canary-base
# (CANARY_PR, CANARY_EXPECTED в .github/reviewer/reviewer_lib.py). Нет
# находки — UNKNOWN(canary_missed), CANARY=FAIL, красный, и «чисто» этой ночи
# не считается чистым.
#
# Задание канареечной заявки выкладывается тем же способом, что снимок
# задания агента (agent-task-<sha256>), — ревьюер проверяет его тем же кодом.
# Текст задания — константа здесь, на защищённой ветке.
#
# push-probe (D-106 §b, повторяемая по D-103 §a): worker-токен с
# contents:write пытается дописать пустой коммит в canary/known-defect и
# обязан получить GH013 от ruleset canary-protection. В паре — успешное
# чтение той же ветки тем же токеном. Проба живёт здесь, а не в reviewer.yml:
# ключ исполнителя в workflow ревьюера не попадает. Её провал делает прогон
# красным, и ревьюер видит это как UNKNOWN(canary_trigger_conclusion:failure).
name: canary-trigger

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: canary-trigger
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Snapshot canary task
        id: snap
        shell: bash
        env:
          TASK: |-
            Добавь в lib/paginate.ts функцию pageCount(total: number, pageSize: number): number —
            число страниц, нужных, чтобы показать total элементов по pageSize на странице;
            последняя страница может быть неполной. При нецелых аргументах, total < 0
            или pageSize < 1 бросай RangeError. Добавь юнит-тесты в tests/unit/paginate.test.ts.
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/agent-task"
          mkdir -p "$d"
          printf '%s' "$TASK" > "$d/task.txt"
          sha="$(sha256sum "$d/task.txt" | cut -d' ' -f1)"
          echo "artifact=agent-task-$sha" >> "$GITHUB_OUTPUT"
          echo "path=$d/task.txt" >> "$GITHUB_OUTPUT"
          echo "canary task snapshot: agent-task-$sha ($(wc -c < "$d/task.txt" | tr -d ' ') bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canary task snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.snap.outputs.artifact }}
          path: ${{ steps.snap.outputs.path }}
          retention-days: 14
          if-no-files-found: error

  push-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Mint worker token (probe, contents:write)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Worker push to canary/known-defect is refused (GH013)
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          # Раннер запускает шаг с bash -e: без set +e неудачный push внутри
          # $(…) завершил бы шаг молча, до вывода текста отказа (прогон
          # 36516855926: отказ был — rule-suite fail, — но в журнале его нет).
          set +e
          set -uo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          url="https://github.com/$REPO"
          g() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          d="$(mktemp -d)"; cd "$d"
          git init -q && git config user.name "canary push probe" && git config user.email "noreply@example.invalid"

          # Положительная пара: тот же токен читает ту же ветку.
          if ! g fetch -q --depth 1 "$url" refs/heads/canary/known-defect; then
            echo "::error::worker token cannot fetch canary/known-defect: the refusal below would prove nothing"
            exit 1
          fi
          git checkout -q FETCH_HEAD
          before="$(git rev-parse HEAD)"
          git commit -q --allow-empty -m "canary push probe — must be refused (D-106 §b)"

          out="$(g push "$url" HEAD:refs/heads/canary/known-defect 2>&1)"; code=$?
          echo "push exit code: $code"
          echo "$out" | sed 's/^/  | /'
          if [ "$code" = 0 ]; then
            echo "::error::worker push to canary/known-defect was ACCEPTED (was $before): the canary branch is not protected; the defect can be removed without a decision"
            exit 1
          fi
          if echo "$out" | grep -q "GH013" && echo "$out" | grep -q "refs/heads/canary/known-defect"; then
            echo "push refused by a repository rule (GH013), as required; canary/known-defect stays at $before"
          else
            echo "::error::worker push failed, but not with GH013 for canary/known-defect (UNKNOWN): the refusal is not the ruleset"
            exit 1
          fi
