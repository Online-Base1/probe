# Проверка федерации OIDC к OpenAI API и allowlist моделей ревьюера другого
# семейства (BB-21a, D-091, D-098, D-099, D-101). Образец —
# anthropic-wif-test.yml. Долгоживущего ключа OpenAI в контуре нет.
#
# Mapping в OpenAI совпадает только с repository_id 1359735765,
# repository_owner_id 325923116, ref refs/heads/main и workflow_ref этого
# файла на main. Шага «отказ вне main» здесь намеренно нет: прогон с другой
# ветки должен получить отказ ОБМЕНА от самого OpenAI — это отрицательная
# проверка федерации.
#
# Граница — allowlist моделей проекта, а не Restricted-права: для WIF-токенов
# права не применяются (rerun 2026-09-28), поэтому проба embeddings убрана.
#   (а) ключей OPENAI_API_KEY / ANTHROPIC_API_KEY в окружении нет;
#   (б) обмен OIDC-токена GitHub на токен OpenAI успешен;
#   (в) models.list точно равен .github/reviewer/expected-models.json;
#   (г) responses.create на gpt-5.3-codex → completed, usage > 0;
#   (д) responses.create на gpt-4.1-nano → только model_not_found;
#   (ж) GET Admin API WIF-токеном → 401/403 (состав привязок без admin-ключа
#       не наблюдаем; admin-ключ не заводится, D-103 §a).
# Проверки — .github/reviewer/openai_checks.py (их же вызывает ревьюер);
# итог PASS / FAIL / UNKNOWN, красный — всё, что не PASS. Токены не печатаются.
name: openai-wif-test

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: openai-wif-test
  cancel-in-progress: false

jobs:
  federation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      # Нужны только файл требований с хешами и .github/reviewer; учётные
      # данные в git не сохраняются.
      - name: Checkout requirements and checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/openai-wif-test.requirements.txt
            .github/reviewer/
          sparse-checkout-cone-mode: false

      - name: Install openai SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          # Все пакеты, включая транзитивные, закреплены версией и sha256;
          # только колёса — сборки из исходников нет.
          /tmp/venv/bin/pip install --quiet --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r .github/workflows/openai-wif-test.requirements.txt

      # Логика проверок на подделках, без сети: если она сломана, до обмена
      # дело не доходит.
      - name: Unit tests of the checks (offline)
        shell: bash
        run: /tmp/venv/bin/python -m unittest discover -s .github/reviewer/tests -v

      - name: Federated checks against OpenAI
        shell: bash
        env:
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          REF: ${{ github.ref }}
        run: /tmp/venv/bin/python .github/reviewer/openai_smoke.py
