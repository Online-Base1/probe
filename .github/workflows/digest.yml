# Ночная сводка (D-121, BB-38): один комментарий за ночь в закреплённую
# factory-knowledge#DIGEST_ISSUE (digest_lib.py).
#
# Свой workflow по расписанию, 12:00 UTC (D-133 d). НЕ job внутри ночного
# прогона и НЕ workflow_run от него (D-121 §c): поверхность, встроенная в
# наблюдаемое, умирает вместе с ним, а сводка обязана выйти и тогда, когда
# ночной прогон не запустился вовсе. Расписание на GitHub Actions не является
# временем (cron 03:17 стартовал в 09:15–10:42), поэтому сводка не строится
# «через N минут после»: её окно — от предыдущей сводки до текущей.
#
# Одиннадцать строк фиксированного порядка (девять D-121 §d, ВЛИВАНИЯ D-137 и
# изменения .github/** с прошлой сводки D-134), DIGEST, последняя строка СВОДКА ПОЛНАЯ /
# СВОДКА НЕПОЛНАЯ. Невычисленная строка — «не наблюдалось: <причина>»;
# сломанный ревьюер сводку не краснит. Красный прогон — только когда
# комментарий не опубликован.
#
# Токены приложения ревьюера (D-104): публикация — только issues:write на
# factory-knowledge; чтение — отдельный токен contents:read и pull-requests:read
# на factory-knowledge (строки ПРАВИЛА и ВЛИВАНИЯ). Права установки не
# расширяются; чего не хватает — печатается «нет права <какое>».
# Ни один процесс не запускается по issue или комментарию (условие D-104,
# test_no_issue_triggers).
name: digest

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout digest code (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/reviewer/
            .github/environment.lock.json
          sparse-checkout-cone-mode: false

      # Не выпускается подмножеством — прогон останавливается здесь, сводки нет.
      - name: Mint reviewer token (factory-knowledge, issues:write)
        id: issues
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FACTORY_REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_REVIEWER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: factory-knowledge
          permission-issues: write

      # Чтение factory-knowledge: строка ПРАВИЛА (contents) и заявки коммитов в
      # строке ВЛИВАНИЯ (pull-requests: площадка на commits/{sha}/pulls ответила
      # 403 pull_requests=read, прогон 38291821501). Право у установки уже есть
      # (D-104), токен его теперь просит. Без этого токена сводка всё равно
      # выходит: ПРАВИЛА и ВЛИВАНИЯ factory-knowledge — «не наблюдалось».
      - name: Mint reviewer token (factory-knowledge, contents:read, pull-requests:read)
        id: fk
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FACTORY_REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_REVIEWER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: factory-knowledge
          permission-contents: read
          permission-pull-requests: read

      # §18′ п.18 (D-143 §d): среда прогона против .github/environment.lock.json.
      # Образ и python3 прогон не красят: строка ENV_CHECK в журнал и артефакт
      # со снятыми пунктами 6, 7, 10, 13, 16; механика в репозиторий не пишет.
      # Сводка обязана выйти и при сломанной сверке (D-121 §c): оба шага не
      # блокируют, строка СРЕДА тогда печатает «не наблюдалось» с причиной.
      - name: Environment check (runtime)
        continue-on-error: true
        shell: bash
        run: python3 .github/reviewer/env_check.py runtime --workflow digest --out "$RUNNER_TEMP/env-check.json"

      - name: Upload environment check
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: env-check-digest-${{ github.run_id }}
          path: ${{ runner.temp }}/env-check.json
          retention-days: 90
          if-no-files-found: error

      - name: Digest
        shell: bash
        env:
          GH_TOKEN_READ: ${{ github.token }}
          GH_TOKEN_KNOWLEDGE: ${{ steps.fk.outputs.token }}
          GH_TOKEN_DIGEST: ${{ steps.issues.outputs.token }}
          ENV_CHECK_FILE: ${{ runner.temp }}/env-check.json
        run: python3 .github/reviewer/digest.py
