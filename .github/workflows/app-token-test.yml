# Проверка токена приложения online-base1-factory-worker (D-084).
#
#   (в+) токен может создать ветку agent/selftest-<run_id>, файл в ней и
#        черновик PR — это ровно то, что нужно агенту;
#   (в−) тот же токен НЕ может создать .github/workflows/x.yml, потому что у
#        приложения нет права Workflows. Ожидается 403/404; любой другой код,
#        включая успех, — провал теста. Если файл создан, ветка удаляется;
#   (в−git) то же через git push: PASS только если push отклонён и в выводе
#        есть отказ GitHub по праву workflows ("refusing to allow a GitHub App
#        to create or update workflow"). Одно слово "workflow" не годится: оно
#        есть в самом пути .github/workflows/y.yml при любой другой ошибке.
#        Если push прошёл, ветка удаляется через API;
#   (г)  номер созданного PR печатается, чтобы вручную убедиться, что ci.yml
#        запустился на заявке, открытой приложением.
#   (г+) ruleset app-branches пропускает приложение в agent/**: создание и
#        удаление agent/neg-test-<run_id> через API — 201 и 204;
#   (г−create) вне agent/** приложение ветку создать не может: API — любой
#        ответ не 2xx и ветки после попытки нет (текст ответа GitHub не
#        сверяется: на создание он «Reference update failed», без слова
#        rule — прогон 36407838460); git push — отказ с GH013;
#   (г−delete) и удалить не может: ci/app-delete-target (создаёт владелец
#        до прогона) через API и через git push :ref — отказ; после — ветка
#        на месте. Проверок main (удаление, перезапись) здесь нет намеренно:
#        при сбое защиты такая проверка разрушительна.
#
# Созданные ветка и черновик PR остаются как свидетельство; закрываются вручную.
name: app-token-test

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: app-token-test
  cancel-in-progress: false

jobs:
  app-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse to run outside main
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error::app-token-test runs only from refs/heads/main"
          exit 1

      - name: Mint app installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Positive and negative checks through the API
        shell: bash
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Раннер запускает `shell: bash` как `bash -e -o pipefail`. Здесь
          # ожидаемые отказы (403, отклонённый push) — это результат проверки,
          # а не сбой шага, поэтому -e снимается и каждый код разбирается явно.
          # Прогон 36304253561 оборвался именно на отклонённом git push.
          set +e
          set -uo pipefail
          echo "::add-mask::$TOKEN"
          api() { # api METHOD PATH [JSON] -> печатает код, тело в /tmp/body.json
            local method="$1" path="$2" data="${3:-}"
            local args=(-sS -o /tmp/body.json -w '%{http_code}' -X "$method"
              -H "Authorization: Bearer $TOKEN"
              -H "Accept: application/vnd.github+json"
              -H "X-GitHub-Api-Version: 2022-11-28")
            [ -n "$data" ] && args+=(-d "$data")
            curl "${args[@]}" "https://api.github.com/repos/$REPO$path"
          }
          b64() { printf '%s' "$1" | base64 -w0; }
          delete_branch() { # тест не должен оставлять ветку с workflow-файлом
            local code
            code="$(api DELETE "/git/refs/heads/$branch")"
            echo "DELETE ref $branch -> $code (expected 204)"
            branch_deleted=1
          }

          branch="agent/selftest-$RUN_ID"
          pos_ok=1
          neg_ok=0
          git_ok=0
          branch_deleted=0

          # (в+) ветка от main
          code="$(api GET /git/ref/heads/main)"; echo "GET  ref main            -> $code"
          main_sha="$(jq -r '.object.sha // empty' /tmp/body.json)"
          [ "$code" = 200 ] && [ -n "$main_sha" ] || pos_ok=0

          if [ "$pos_ok" = 1 ]; then
            code="$(api POST /git/refs "$(jq -nc --arg r "refs/heads/$branch" --arg s "$main_sha" '{ref:$r,sha:$s}')")"
            echo "POST ref $branch -> $code"
            [ "$code" = 201 ] || pos_ok=0
          fi

          # (в+) файл вне .github/ в этой ветке
          if [ "$pos_ok" = 1 ]; then
            code="$(api PUT "/contents/selftest/$RUN_ID.md" "$(jq -nc \
              --arg m "selftest: app token writes a file ($RUN_ID)" \
              --arg c "$(b64 "app-token-test run $RUN_ID")" --arg b "$branch" \
              '{message:$m,content:$c,branch:$b}')")"
            echo "PUT  selftest/$RUN_ID.md -> $code"
            [ "$code" = 201 ] || pos_ok=0
          fi

          # (в+) черновик PR; (г) его номер
          pr_number=""
          if [ "$pos_ok" = 1 ]; then
            code="$(api POST /pulls "$(jq -nc --arg h "$branch" --arg r "$RUN_ID" \
              '{title:("selftest: PR opened by app (run " + $r + ", do not merge)"),
                head:$h, base:"main", draft:true,
                body:"Created by app-token-test.yml. Check that ci.yml ran on this PR, then close it."}')")"
            echo "POST pull (draft)        -> $code"
            pr_number="$(jq -r '.number // empty' /tmp/body.json)"
            [ "$code" = 201 ] && [ -n "$pr_number" ] || pos_ok=0
          fi

          # (в−) тем же токеном в той же ветке — файл workflow
          if [ "$pos_ok" = 1 ]; then
            code="$(api PUT /contents/.github/workflows/x.yml "$(jq -nc \
              --arg m "selftest: app token must NOT write workflows ($RUN_ID)" \
              --arg c "$(b64 $'name: x\non: workflow_dispatch\njobs:\n  x:\n    runs-on: ubuntu-latest\n    steps:\n      - run: "true"\n')" \
              --arg b "$branch" '{message:$m,content:$c,branch:$b}')")"
            echo "PUT  .github/workflows/x.yml -> $code (expected 403 or 404)"
            jq -r '"     message: " + (.message // "")' /tmp/body.json
            case "$code" in
              403|404) neg_ok=1 ;;
              2??)
                neg_ok=0
                echo "::error::(в−) workflow file was CREATED through the API; deleting $branch"
                delete_branch ;;
              *) neg_ok=0 ;;
            esac
          else
            echo "(в−) not run: positive check failed, the branch may not exist"
          fi

          # (в−git) тем же токеном через git push. URL с токеном не печатается;
          # весь вывод git проходит через замену токена на ***.
          redact() { sed "s/${TOKEN}/***/g"; }
          if [ "$pos_ok" = 1 ] && [ "$branch_deleted" = 0 ]; then
            work="$(mktemp -d)"
            if git clone --quiet --depth 1 --branch "$branch" \
                 "https://x-access-token:${TOKEN}@github.com/$REPO" "$work/repo" 2> "$work/clone.err"; then
              cd "$work/repo"
              git config user.name "app-token-test"
              git config user.email "app-token-test@users.noreply.github.com"
              mkdir -p .github/workflows
              printf 'name: y\non: workflow_dispatch\njobs:\n  y:\n    runs-on: ubuntu-latest\n    steps:\n      - run: "true"\n' \
                > .github/workflows/y.yml
              git add .github/workflows/y.yml
              # Без нового коммита push ответит «Everything up-to-date» с кодом 0,
              # и это ложно читалось бы как принятый workflow-файл.
              if git commit --quiet -m "selftest: app token must NOT push workflows ($RUN_ID)"; then
                if git push origin HEAD > "$work/push.out" 2> "$work/push.err"; then push_rc=0; else push_rc=$?; fi
              else
                push_rc=""
              fi
              cd - > /dev/null
              if [ -z "$push_rc" ]; then
                echo "(в−git) local commit failed; push not attempted, nothing is proven"
              else
                echo "git push origin HEAD -> exit $push_rc (expected non-zero)"
                echo "     stderr:"
                redact < "$work/push.err" | sed 's/^/       /'
              fi
              if [ -z "$push_rc" ]; then
                :
              elif [ "$push_rc" -ne 0 ] && grep -qiE 'refusing to allow a GitHub App to create or update workflow' "$work/push.err"; then
                git_ok=1
              elif [ "$push_rc" -eq 0 ]; then
                echo "::error::(в−git) push of a workflow file SUCCEEDED; deleting $branch"
                delete_branch
              else
                echo "(в−git) push failed, but not with a workflow-permission refusal"
              fi
            else
              echo "(в−git) clone failed:"
              redact < "$work/clone.err" | sed 's/^/       /'
            fi
            rm -rf "$work"
          elif [ "$branch_deleted" = 1 ]; then
            echo "(в−git) not run: branch was deleted after the (в−) breach"
          else
            echo "(в−git) not run: positive check failed, the branch may not exist"
          fi

          # (г+ / г−create / г−delete) ruleset app-branches (D-089 §c).
          g_pos=0; g_create_api=0; g_create_git=0; g_delete_api=0; g_delete_git=0; g_target_kept=0
          ruleset_refusal() { # тело ответа API упоминает правило/ruleset
            jq -r '.message // "" , (.errors // [] | tostring)' /tmp/body.json | grep -qiE 'rule'
          }
          main_sha="$(api GET /git/ref/heads/main > /dev/null; jq -r '.object.sha // empty' /tmp/body.json)"

          # (г+) agent/** — создать и удалить через API.
          gbranch="agent/neg-test-$RUN_ID"
          code="$(api POST /git/refs "$(jq -nc --arg r "refs/heads/$gbranch" --arg s "$main_sha" '{ref:$r,sha:$s}')")"
          echo "(г+) POST ref $gbranch -> $code (expected 201)"
          if [ "$code" = 201 ]; then
            code="$(api DELETE "/git/refs/heads/$gbranch")"
            echo "(г+) DELETE ref $gbranch -> $code (expected 204)"
            [ "$code" = 204 ] && g_pos=1
          fi

          # (г−create) вне agent/** — через API.
          cbranch="ci/neg-test-$RUN_ID"
          code="$(api POST /git/refs "$(jq -nc --arg r "refs/heads/$cbranch" --arg s "$main_sha" '{ref:$r,sha:$s}')")"
          echo "(г−create) POST ref $cbranch -> $code (expected non-2xx, branch absent afterwards)"
          echo "     response body:"; sed 's/^/       /' /tmp/body.json; echo
          # Факт — отсутствие ветки после попытки, а не текст ответа.
          after="$(api GET "/git/ref/heads/$cbranch")"
          echo "(г−create) GET ref $cbranch after -> $after (expected 404)"
          case "$code" in
            2??) echo "::error::(г−create) app CREATED $cbranch outside agent/** — ruleset does not hold; the branch must be removed by the owner" ;;
            *) if [ "$after" = 404 ]; then g_create_api=1
               else echo "::error::(г−create) API refused ($code), but $cbranch exists afterwards ($after)"; fi ;;
          esac

          # (г−create) и (г−delete) через git push.
          gwork="$(mktemp -d)"
          if git clone --quiet --depth 1 --branch main \
               "https://x-access-token:${TOKEN}@github.com/$REPO" "$gwork/repo" 2> "$gwork/clone.err"; then
            cd "$gwork/repo"
            if git push origin "HEAD:refs/heads/$cbranch-git" > "$gwork/c.out" 2> "$gwork/c.err"; then crc=0; else crc=$?; fi
            echo "(г−create) git push HEAD:refs/heads/$cbranch-git -> exit $crc (expected non-zero, GH013)"
            redact < "$gwork/c.err" | sed 's/^/       /'
            if [ "$crc" -ne 0 ] && grep -q 'GH013' "$gwork/c.err"; then g_create_git=1
            elif [ "$crc" -eq 0 ]; then echo "::error::(г−create) app CREATED $cbranch-git by git push — ruleset does not hold; the branch must be removed by the owner"; fi

            if git ls-remote --exit-code origin refs/heads/ci/app-delete-target > /dev/null 2>&1; then
              if git push origin :refs/heads/ci/app-delete-target > "$gwork/d.out" 2> "$gwork/d.err"; then drc=0; else drc=$?; fi
              echo "(г−delete) git push :refs/heads/ci/app-delete-target -> exit $drc (expected non-zero, GH013)"
              redact < "$gwork/d.err" | sed 's/^/       /'
              if [ "$drc" -ne 0 ] && grep -q 'GH013' "$gwork/d.err"; then g_delete_git=1; fi
            else
              echo "::error::(г−delete) precondition failed: ci/app-delete-target does not exist — the owner creates it before the run; nothing is proven"
            fi
            cd - > /dev/null
          else
            echo "(г) clone failed:"; redact < "$gwork/clone.err" | sed 's/^/       /'
          fi
          rm -rf "$gwork"

          # (г−delete) через API и проверка, что ветка на месте.
          code="$(api GET /git/ref/heads/ci/app-delete-target)"
          if [ "$code" = 200 ]; then
            code="$(api DELETE /git/refs/heads/ci/app-delete-target)"
            echo "(г−delete) DELETE ref ci/app-delete-target -> $code (expected 422/403 with a rule refusal)"
            jq -r '"     message: " + (.message // "")' /tmp/body.json 2>/dev/null || true
            case "$code" in
              422|403) ruleset_refusal && g_delete_api=1 || echo "     refused, but not by a rule" ;;
              204) echo "::error::(г−delete) app DELETED ci/app-delete-target — ruleset does not hold" ;;
            esac
          fi
          code="$(api GET /git/ref/heads/ci/app-delete-target)"
          echo "(г−delete) GET ref ci/app-delete-target after -> $code (expected 200)"
          [ "$code" = 200 ] && g_target_kept=1

          {
            echo "### app-token-test"
            echo "- (в+) branch, file, draft PR: $([ "$pos_ok" = 1 ] && echo PASS || echo FAIL)"
            echo "- (в−) workflow write refused: $([ "$neg_ok" = 1 ] && echo PASS || echo FAIL)"
            echo "- (в−git) workflow push refused: $([ "$git_ok" = 1 ] && echo PASS || echo FAIL)"
            echo "- (г) PR opened by app: ${pr_number:+#$pr_number} — check that ci.yml ran on it"
            echo "- (г+) agent/** create+delete: $([ "$g_pos" = 1 ] && echo PASS || echo FAIL)"
            echo "- (г−create) outside agent/**: API $([ "$g_create_api" = 1 ] && echo PASS || echo FAIL), git $([ "$g_create_git" = 1 ] && echo PASS || echo FAIL)"
            echo "- (г−delete) ci/app-delete-target: API $([ "$g_delete_api" = 1 ] && echo PASS || echo FAIL), git $([ "$g_delete_git" = 1 ] && echo PASS || echo FAIL), still exists $([ "$g_target_kept" = 1 ] && echo PASS || echo FAIL)"
          } >> "$GITHUB_STEP_SUMMARY"

          [ -n "$pr_number" ] && echo "(г) PR opened by app: https://github.com/$REPO/pull/$pr_number"
          failed=0
          [ "$pos_ok" = 1 ] || { echo "::error::(в+) positive check failed"; failed=1; }
          [ "$neg_ok" = 1 ] || { echo "::error::(в−) workflow write was not refused with 403/404"; failed=1; }
          [ "$git_ok" = 1 ] || { echo "::error::(в−git) workflow push was not refused"; failed=1; }
          [ "$g_pos" = 1 ] || { echo "::error::(г+) app could not create/delete a branch under agent/**"; failed=1; }
          [ "$g_create_api" = 1 ] || { echo "::error::(г−create) API creation outside agent/** was not refused (non-2xx and branch absent afterwards)"; failed=1; }
          [ "$g_create_git" = 1 ] || { echo "::error::(г−create) git push creation outside agent/** was not refused with GH013"; failed=1; }
          [ "$g_delete_api" = 1 ] || { echo "::error::(г−delete) API deletion of ci/app-delete-target was not refused by a rule"; failed=1; }
          [ "$g_delete_git" = 1 ] || { echo "::error::(г−delete) git push deletion of ci/app-delete-target was not refused with GH013"; failed=1; }
          [ "$g_target_kept" = 1 ] || { echo "::error::(г−delete) ci/app-delete-target is gone"; failed=1; }
          [ "$failed" = 0 ] || exit 1
          echo "app token: (в+) PASS, (в−) PASS, (в−git) PASS, (г+) PASS, (г−create) PASS, (г−delete) PASS"
